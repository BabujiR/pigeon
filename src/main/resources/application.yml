# Pigeon - shared configuration. Environment-specific values live in application-<profile>.yml.
# No credentials here: they come from the profile (LocalStack) or the runtime role (real AWS).
spring:
  application:
    name: pigeon
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${PIGEON_DB_URL}
    username: ${PIGEON_DB_USERNAME}
    password: ${PIGEON_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        listener:
          max-messages-per-poll: 10
          poll-timeout: 10s           # long polling: fewer empty receives, lower cost

pigeon:
  aws:
    queues:
      send: pigeon-send-queue
      send-dlq: pigeon-send-dlq
      events: pigeon-events-queue
      events-dlq: pigeon-events-dlq
    events-topic: pigeon-events-topic
    configuration-sets:
      transactional: pigeon-txn-prod
      bulk: pigeon-bulk-prod
    identity: notify.pigeon.local
  idempotency:
    ttl: 24h
  sender:
    enabled: true
    concurrency: 10
    rate-per-second: 14         # per instance; fleet total must stay under the SES MaxSendRate
    max-attempts: 3
    lease: 2m
    base-backoff: 10s
    max-backoff: 5m
    from-display-name: Acme Benefits
  events:
    enabled: true
    soft-bounce-threshold: 3      # transient bounces ...
    soft-bounce-window: 7d        # ... within this window suppress the address
    simulator:
      enabled: false              # local profile only; on AWS real SES events arrive via SNS
  metrics:
    minimum-volume: 20            # sends in the window before rates are judged
    bounce-warning: 2.0           # our early alarm, % (hard bounces)
    bounce-review: 5.0            # SES review level, %
    bounce-pause: 10.0            # SES pause level, %
    complaint-warning: 0.05
    complaint-review: 0.1
    complaint-pause: 0.5
    default-window: 24h
    max-window: 31d
    refresh-interval-ms: 30000    # Prometheus gauge refresh
  outbox:
    relay:
      enabled: true
      poll-interval-ms: 500
      batch-size: 50
      max-attempts: 20

server:
  port: 8080
  shutdown: graceful            # finish in-flight requests and SQS messages before stopping
  error:
    include-stacktrace: never   # never leak internals in error responses
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Pigeon
    tagline: Trusted delivery, built on AWS SES.

# Plain, human-readable log lines. Every line carries the correlation id and message id, so
# searching for one id shows a request's whole journey: API -> relay -> sender -> SES events.
# For JSON (ECS) logs, as a log platform wants them, add the "json" profile.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] [%X{correlationId:-}] [%X{messageId:-}] %-40.40logger{39} : %m%n%wEx"
  level:
    com.pigeon: INFO
